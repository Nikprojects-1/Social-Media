<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Accounts — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <button class="btn btn-primary mb-2 reveal">+ Connect Account</button>
        <div class="grid-3" id="accounts-grid"></div>
        <div class="card glass reveal mt-2"><h3 class="mb-2">Account Analytics Summary</h3><div id="accounts-table"></div></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Social Accounts', 'Manage 7 platform integrations');
      SocialPulseApp.renderPlatformCards('accounts-grid');
      SocialPulseApp.renderTable('accounts-table', SocialPulseData.platformStats, [
        { label: 'Platform', key: 'name', render: r => `${r.icon} ${r.name}` },
        { label: 'Followers', key: 'followers', render: r => SocialPulseData.formatNum(r.followers) },
        { label: 'Posts', key: 'posts' },
        { label: 'Engagement', key: 'engagement', render: r => r.engagement + '%' },
        { label: 'Reach', key: 'reach', render: r => SocialPulseData.formatNum(r.reach) },
        { label: 'Status', key: 'connected', render: r => `<span class="badge badge-${r.connected?'success':'warning'}">${r.connected?'Connected':'Disconnected'}</span>` }
      ]);
    });
  </script>
</body>
</html>
