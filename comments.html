<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments & Messages — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="grid-2">
          <div>
            <div class="tabs reveal"><button class="tab active">Comments (100)</button><button class="tab">Spam Filter</button></div>
            <div id="comments-list" style="max-height:600px;overflow-y:auto"></div>
          </div>
          <div>
            <h3 class="reveal">Direct Messages (50)</h3>
            <div class="card glass reveal mb-2"><input class="form-input" placeholder="Auto-reply message template..."><button class="btn btn-sm btn-outline mt-1">Save Auto-Reply</button></div>
            <div id="messages-list" style="max-height:550px;overflow-y:auto"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Comments & Messages', '100 comments and 50 inbox conversations');
      SocialPulseAnalytics.renderComments('comments-list');
      SocialPulseAnalytics.renderMessages('messages-list');
    });
  </script>
</body>
</html>
