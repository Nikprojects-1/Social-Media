<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trend Monitoring — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="card glass reveal" style="border-color:var(--accent)">
          <h3>🔮 Trend Prediction UI</h3>
          <p class="text-muted">AI predicts <strong>Short-form Video</strong> and <strong>AI Tools</strong> topics will peak in the next 14 days (+42% volume)</p>
        </div>
        <div class="card glass reveal mt-2"><h3 class="mb-2">Social Listening Dashboard</h3><div id="trends-list"></div></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Trend Monitoring', '30 trending topics with volume and sentiment');
      document.getElementById('trends-list').innerHTML = SocialPulseData.trends.map(t => `
        <div class="metric-row reveal" data-searchable">
          <span><strong>${t.topic}</strong><br><span class="text-muted" style="font-size:0.75rem">${t.platforms.join(', ')}</span></span>
          <div class="metric-bar"><div class="metric-bar-fill" style="width:${Math.min(100,t.volume/50000)}%"></div></div>
          <span class="trend-tag trend-up">+${t.growth}%</span>
        </div>`).join('');
    });
  </script>
</body>
</html>
