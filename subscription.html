<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Plans — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="section-header reveal" style="text-align:center;margin-bottom:2rem"><h2>Choose Your Plan</h2><p class="text-muted">Scale your social media management</p></div>
        <div class="pricing-grid" id="subscription-plans"></div>
        <div class="card glass reveal mt-2" style="text-align:center;padding:2rem">
          <h3>Link Tracking & Bio Page Builder</h3>
          <p class="text-muted mt-1">Included in Professional plan and above</p>
          <button class="btn btn-outline mt-2">Configure Bio Page</button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Subscription Plans', 'Starter, Professional, Business, and Enterprise tiers');
      document.getElementById('subscription-plans').innerHTML = SocialPulseData.subscriptions.map(s =>
        `<div class="glass pricing-card card reveal ${s.popular?'featured':''}"><h3>${s.name}</h3><div class="price">$${s.price}<span>/mo</span></div><ul class="pricing-features">${s.features.map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn ${s.popular?'btn-primary':'btn-outline'} w-full">Subscribe</button></div>`
      ).join('');
    });
  </script>
</body>
</html>
