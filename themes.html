<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark / Light Themes — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="card glass reveal">
          <h3 class="mb-2">Theme Mode</h3>
          <p class="text-muted mb-2">Toggle between dark and light themes. Preference saved to localStorage.</p>
          <button class="btn btn-primary" id="theme-toggle-page">Toggle Dark / Light</button>
        </div>
        <h3 class="mt-2 reveal">Theme Presets</h3>
        <div class="theme-options mt-1">
          <div class="card reveal"><div class="theme-preview theme-dark-preview active" data-theme="dark"></div><h4>Dark (Default)</h4><p class="text-muted">#0F172A background</p></div>
          <div class="card reveal"><div class="theme-preview theme-light-preview" data-theme="light"></div><h4>Light</h4><p class="text-muted">Clean professional look</p></div>
          <div class="card reveal"><div class="theme-preview theme-purple-preview" data-theme="dark"></div><h4>Purple Accent</h4><p class="text-muted">Enhanced violet tones</p></div>
          <div class="card reveal"><div class="theme-preview theme-ocean-preview" data-theme="dark"></div><h4>Ocean</h4><p class="text-muted">Cyan accent focus</p></div>
        </div>
        <div class="card glass reveal mt-2">
          <h3>Preview Components</h3>
          <div class="stats-grid mt-2">
            <div class="card stat-card"><div class="stat-label">Sample Stat</div><div class="stat-value">2.8M</div></div>
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-outline">Outline</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Theme Customization', 'Dark/light modes with persistent preferences');
      document.getElementById('theme-toggle-page')?.addEventListener('click', () => SocialPulseThemes.toggle());
    });
  </script>
</body>
</html>
