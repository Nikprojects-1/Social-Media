<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Library — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="flex-between reveal mb-2">
          <div class="tabs"><button class="tab active">All</button><button class="tab">Images</button><button class="tab">Videos</button><button class="tab">GIFs</button></div>
          <button class="btn btn-primary">+ Upload Media</button>
        </div>
        <div class="card" style="border:2px dashed var(--border);padding:3rem;text-align:center;margin-bottom:1.5rem" class="reveal">
          <p style="font-size:2rem">📁</p>
          <p>Drag & drop files here — supports JPG, PNG, MP4, GIF</p>
        </div>
        <div id="media-grid"></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Media Library', '80+ assets — images, videos, and scheduled media');
      SocialPulseAnalytics.renderMedia('media-grid');
    });
  </script>
</body>
</html>
