<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="card glass reveal" style="padding:2rem">
          <div class="flex gap-2" style="align-items:center">
            <div class="avatar avatar-lg">SP</div>
            <div><h2>Social Manager</h2><p class="text-muted">Admin · Professional Plan</p><span class="badge badge-success">Online</span></div>
          </div>
        </div>
        <div class="grid-2 mt-2">
          <div class="card glass reveal">
            <h3 class="mb-2">Profile Information</h3>
            <div class="form-group"><label class="form-label">Display Name</label><input class="form-input" value="Social Manager"></div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" value="manager@workspace.demo"></div>
            <div class="form-group"><label class="form-label">Role</label><input class="form-input" value="Administrator" readonly></div>
            <button class="btn btn-primary">Update Profile</button>
          </div>
          <div class="card glass reveal">
            <h3 class="mb-2">Your Stats</h3>
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-label">Posts Created</div><div class="stat-value">342</div></div>
              <div class="stat-card"><div class="stat-label">Campaigns</div><div class="stat-value">28</div></div>
              <div class="stat-card"><div class="stat-label">Reports</div><div class="stat-value">56</div></div>
              <div class="stat-card"><div class="stat-label">Team Actions</div><div class="stat-value">1.2K</div></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>SocialPulseApp.initLayout('User Profile','Manage your account and view activity'));</script>
</body>
</html>
