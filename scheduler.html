<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Scheduler — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-orbs"><div class="orb orb-1"></div></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="grid-2">
          <div class="card glass reveal">
            <h3 class="mb-2">Create New Post</h3>
            <div class="form-group"><label class="form-label">Caption</label><textarea class="form-textarea" placeholder="Write your caption...">Discover how data-driven social strategies transform engagement. #marketing #growth</textarea></div>
            <div class="form-group"><label class="form-label">Platforms</label>
              <div class="flex gap-1" style="flex-wrap:wrap">
                <label><input type="checkbox" checked> Instagram</label>
                <label><input type="checkbox" checked> Facebook</label>
                <label><input type="checkbox"> Twitter</label>
                <label><input type="checkbox"> LinkedIn</label>
              </div>
            </div>
            <div class="grid-2">
              <div class="form-group"><label class="form-label">Date</label><input type="date" class="form-input" value="2025-05-28"></div>
              <div class="form-group"><label class="form-label">Time</label><input type="time" class="form-input" value="14:30"></div>
            </div>
            <div class="form-group"><label class="form-label">Hashtag Suggestions</label>
              <div class="hashtag-cloud" id="hashtag-suggestions"></div>
            </div>
            <div class="card" style="border:2px dashed var(--border);padding:2rem;text-align:center;margin-bottom:1rem">
              <p>📁 Drag & drop media here or click to upload</p>
            </div>
            <button class="btn btn-primary">Schedule Post</button>
            <button class="btn btn-outline">Save Draft</button>
          </div>
          <div>
            <div class="card glass reveal mb-2"><h3 class="mb-2">Mini Calendar</h3><div id="content-calendar"></div></div>
            <div class="card glass reveal"><h3 class="mb-2">Publishing Queue</h3><div id="post-queue" style="max-height:400px;overflow-y:auto"></div></div>
          </div>
        </div>
        <h3 class="mt-2 reveal">All Scheduled Posts (230+)</h3>
        <div id="scheduled-posts-list" class="mt-1"></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Post Scheduler', 'Schedule, draft, and manage multi-platform content');
      SocialPulseScheduler.initSchedulerPage();
      SocialPulseAnalytics.renderHashtags('hashtag-suggestions', 30);
    });
  </script>
</body>
</html>
