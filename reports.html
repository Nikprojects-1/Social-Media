<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports & Export — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="grid-2">
          <div class="card glass reveal">
            <h3 class="mb-2">Generate Report</h3>
            <div class="form-group"><label class="form-label">Report Type</label><select class="form-select"><option>Full Analytics</option><option>Engagement</option><option>Campaign ROI</option><option>Audience</option></select></div>
            <div class="form-group"><label class="form-label">Format</label><select class="form-select"><option>PDF</option><option>CSV</option><option>XLSX</option></select></div>
            <div class="form-group"><label class="form-label">Date Range</label><input type="text" class="form-input" value="Last 30 days"></div>
            <button class="btn btn-primary w-full">Generate & Download</button>
          </div>
          <div class="card glass reveal">
            <h3 class="mb-2">Scheduled Reports</h3>
            <p class="text-muted mb-2">Weekly analytics every Monday 9:00 AM</p>
            <p class="text-muted mb-2">Monthly ROI report — 1st of month</p>
            <button class="btn btn-outline">+ Add Schedule</button>
          </div>
        </div>
        <h3 class="mt-2 reveal">Report History (24 reports)</h3>
        <div class="card glass reveal mt-1"><div id="reports-table"></div></div>
        <div class="card glass reveal mt-2" style="padding:2rem;border:1px solid var(--border)">
          <h3>Print Preview</h3>
          <p class="text-muted mt-1">SocialPulse Analytics Report — May 2025</p>
          <div class="stats-grid mt-2">
            <div><strong>2.8M</strong><br><span class="text-muted">Followers</span></div>
            <div><strong>4.87%</strong><br><span class="text-muted">Engagement</span></div>
            <div><strong>12.8M</strong><br><span class="text-muted">Reach</span></div>
          </div>
          <button class="btn btn-outline mt-2" onclick="window.print()">🖨️ Print Report</button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Reports & Export', 'Download, schedule, and customize analytics reports');
      SocialPulseApp.renderTable('reports-table', SocialPulseData.reports, [
        { label: 'Report', key: 'name' },
        { label: 'Type', key: 'type', render: r => `<span class="badge badge-primary">${r.type}</span>` },
        { label: 'Size', key: 'size' },
        { label: 'Generated', key: 'generated' },
        { label: 'Status', key: 'status', render: r => `<span class="badge badge-${r.status==='Ready'?'success':'warning'}">${r.status}</span>` },
        { label: '', key: 'id', render: () => '<button class="btn btn-sm btn-outline">Download</button>' }
      ]);
    });
  </script>
</body>
</html>
