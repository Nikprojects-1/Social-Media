<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Collaboration — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="flex-between reveal mb-2"><button class="btn btn-primary">+ Invite Member</button><button class="btn btn-outline">Manage Permissions</button></div>
        <div class="grid-3" id="team-grid"></div>
        <div class="card glass reveal mt-2"><h3 class="mb-2">Team Activity Feed</h3><div id="team-activity"></div></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Team Collaboration', '25 team members with shared workspaces');
      document.getElementById('team-grid').innerHTML = SocialPulseData.team.map(m => `
        <div class="card reveal" data-searchable>
          <div class="flex gap-2"><div class="avatar">${m.avatar}</div>
          <div><strong>${m.name}</strong><br><span class="text-muted" style="font-size:0.8rem">${m.email}</span>
          <div class="mt-1"><span class="badge badge-primary">${m.role}</span>
          <span class="badge badge-${m.status==='online'?'success':'primary'}">${m.status}</span></div></div></div>
          <p class="text-muted mt-2" style="font-size:0.8rem">${m.posts} posts · Active ${m.lastActive}</p>
        </div>`).join('');
      SocialPulseApp.renderActivityFeed('team-activity', 30);
    });
  </script>
</body>
</html>
