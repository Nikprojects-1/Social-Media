<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — SocialPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-layout">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header" id="page-header"></header>
      <div class="page-content">
        <div class="tabs reveal"><button class="tab active">All (120)</button><button class="tab">Unread</button><button class="tab">Engagement</button><button class="tab">Campaigns</button><button class="tab">Team</button></div>
        <div class="flex-between mb-2"><button class="btn btn-outline btn-sm">Mark all read</button><button class="btn btn-primary btn-sm" onclick="SocialPulseNotifications.toast('Test notification sent!','✅')">Test Toast</button></div>
        <div id="notifications-list"></div>
        <h3 class="mt-2 reveal">Activity Timeline</h3>
        <div class="card glass reveal mt-1"><div class="activity-feed" id="notif-activity"></div></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialPulseApp.initLayout('Notifications Center', '120 notifications — followers, engagement, campaigns, and team activity');
      SocialPulseNotifications.renderNotificationsPage();
      SocialPulseApp.renderActivityFeed('notif-activity', 40);
    });
  </script>
</body>
</html>
